<!DOCTYPE html>
<html>

<head>
    <title>Minecraft Server Control</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script>
        const apiBaseUrl = "https://w6b144nh04.execute-api.ap-southeast-2.amazonaws.com"; // Replace with your API Gateway URL

        async function parseApiResponse(response) {
            const text = await response.text();
            try {
                return JSON.parse(text);
            } catch (error) {
                return text;
            }
        }

        async function checkEC2Status() {
            try {
                const response = await fetch(`${apiBaseUrl}/status`, { method: "GET" });
                const result = await parseApiResponse(response);
                const ec2Status = (result.state || "unknown").toLowerCase();

                document.getElementById("ec2Status").innerText = `EC2 Status: ${ec2Status.toUpperCase()}`;

                // Enable/Disable buttons based on EC2 state
                if (ec2Status === "stopped") {
                    document.getElementById("startBtn").disabled = false;
                    document.getElementById("stopBtn").disabled = true;
                    setMinecraftButtonsDisabled(true);
                    setMinecraftStatusStopped();
                } else if (ec2Status === "running") {
                    document.getElementById("startBtn").disabled = true;
                    document.getElementById("stopBtn").disabled = false;
                    setMinecraftButtonsDisabled(false);
                } else {
                    document.getElementById("startBtn").disabled = true;
                    document.getElementById("stopBtn").disabled = true;
                    setMinecraftButtonsDisabled(true);
                }
            } catch (error) {
                console.error("Error fetching EC2 status:", error);
                document.getElementById("ec2Status").innerText = "EC2 Status: Unknown";
            }
        }

        async function sendRequest(endpoint, method, buttonId) {
            const button = document.getElementById(buttonId);
            button.disabled = true; // Disable button to prevent multiple clicks

            try {
                const response = await fetch(`${apiBaseUrl}${endpoint}`, {
                    method: method,
                    headers: { "Content-Type": "application/json" }
                });

                const result = await parseApiResponse(response);
                if (typeof result === "string") {
                    alert(result);
                } else {
                    alert(result.message || "Operation successful");
                }

                setTimeout(checkEC2Status, 3000); // Refresh EC2 status after action
                setTimeout(checkMinecraftStatuses, 3000);
            } catch (error) {
                console.error("Error:", error);
                alert("Error processing request.");
            } finally {
                setTimeout(() => {
                    button.disabled = false; // Re-enable button after delay
                }, 5000);
            }
        }

        async function startServer() {
            await sendRequest("/start", "POST", "startBtn");
        }

        async function stopServer() {
            await sendRequest("/stop", "POST", "stopBtn");
        }

        async function startMinecraftServer(serverType, buttonId) {
            await sendRequest(`/mc/start/${serverType}`, "POST", buttonId);
        }

        async function stopMinecraftServer(serverType, buttonId) {
            await sendRequest(`/mc/stop/${serverType}`, "POST", buttonId);
        }

        async function fetchMinecraftStatus(serverType) {
            const response = await fetch(`${apiBaseUrl}/mc/status/${serverType}`, { method: "GET" });
            return parseApiResponse(response);
        }

        function formatUptime(seconds) {
            if (seconds === null || seconds === undefined) {
                return "Uptime: --";
            }
            const total = Number(seconds);
            const days = Math.floor(total / 86400);
            const hours = Math.floor((total % 86400) / 3600);
            const mins = Math.floor((total % 3600) / 60);
            const secs = total % 60;
            const parts = [];
            if (days) parts.push(`${days}d`);
            if (hours || days) parts.push(`${hours}h`);
            if (mins || hours || days) parts.push(`${mins}m`);
            parts.push(`${secs}s`);
            return `Uptime: ${parts.join(" ")}`;
        }

        async function updateMinecraftStatus(serverType, statusId, uptimeId) {
            try {
                const result = await fetchMinecraftStatus(serverType);
                const isRunning = result.running;
                const statusEl = document.getElementById(statusId);
                const uptimeEl = document.getElementById(uptimeId);
                statusEl.innerText = `${serverType.toUpperCase()} Status: ${isRunning ? "RUNNING" : "STOPPED"}`;
                uptimeEl.innerText = isRunning ? formatUptime(result.uptime_seconds) : "Uptime: --";
            } catch (error) {
                console.error("Error fetching Minecraft status:", error);
                document.getElementById(statusId).innerText = `${serverType.toUpperCase()} Status: Unknown`;
                document.getElementById(uptimeId).innerText = "Uptime: --";
            }
        }

        async function checkMinecraftStatuses() {
            await Promise.all([
                updateMinecraftStatus("forge", "forgeStatus", "forgeUptime"),
                updateMinecraftStatus("vanilla", "vanillaStatus", "vanillaUptime")
            ]);
        }

        function setMinecraftButtonsDisabled(isDisabled) {
            document.getElementById("startForgeBtn").disabled = isDisabled;
            document.getElementById("stopForgeBtn").disabled = isDisabled;
            document.getElementById("startVanillaBtn").disabled = isDisabled;
            document.getElementById("stopVanillaBtn").disabled = isDisabled;
        }

        function setMinecraftStatusStopped() {
            document.getElementById("forgeStatus").innerText = "FORGE Status: STOPPED";
            document.getElementById("forgeUptime").innerText = "Uptime: --";
            document.getElementById("vanillaStatus").innerText = "VANILLA Status: STOPPED";
            document.getElementById("vanillaUptime").innerText = "Uptime: --";
        }

        window.onload = async () => {
            await checkEC2Status();
            await checkMinecraftStatuses();
        };
    </script>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center">Minecraft Server Control</h1>
        <h3 class="text-center" id="ec2Status">EC2 Status: Checking...</h3>

        <div class="d-grid gap-3 mt-4">
            <button id="startBtn" class="btn btn-success" onclick="startServer()" disabled>Start EC2 Server</button>
            <button id="stopBtn" class="btn btn-danger" onclick="stopServer()" disabled>Stop EC2 Server</button>
        </div>

        <div class="row mt-5">
            <div class="col-md-6">
                <h4>Forge Server</h4>
                <p id="forgeStatus">FORGE Status: Checking...</p>
                <p id="forgeUptime">Uptime: --</p>
                <div class="d-grid gap-2">
                    <button id="startForgeBtn" class="btn btn-warning"
                        onclick="startMinecraftServer('forge', 'startForgeBtn')" disabled>Start Forge Server</button>
                    <button id="stopForgeBtn" class="btn btn-outline-danger"
                        onclick="stopMinecraftServer('forge', 'stopForgeBtn')" disabled>Stop Forge Server</button>
                </div>
            </div>
            <div class="col-md-6">
                <h4>Vanilla Server</h4>
                <p id="vanillaStatus">VANILLA Status: Checking...</p>
                <p id="vanillaUptime">Uptime: --</p>
                <div class="d-grid gap-2">
                    <button id="startVanillaBtn" class="btn btn-warning"
                        onclick="startMinecraftServer('vanilla', 'startVanillaBtn')" disabled>Start Vanilla
                        Server</button>
                    <button id="stopVanillaBtn" class="btn btn-outline-danger"
                        onclick="stopMinecraftServer('vanilla', 'stopVanillaBtn')" disabled>Stop Vanilla Server</button>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
